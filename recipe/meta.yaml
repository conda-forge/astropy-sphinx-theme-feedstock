{% set name = "astropy-sphinx-theme" %}
{% set version = "3.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 9894e7616f3e467f41550cec8d2be12559d902c8e3f0c0114a2c08f912c17f68

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=80
    - setuptools-scm >=8
  run:
    - python >={{ python_min }}
    - sphinx >6
    - sunpy-sphinx-theme >=2.4.0

test:
  imports:
    - astropy_sphinx_theme
    - astropy_sphinx_theme.astropy_unified
    - astropy_sphinx_theme.bootstrap_astropy
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/astropy/astropy-sphinx-theme
  summary: The sphinx theme for Astropy and affiliated packages.
  license: BSD-3-Clause
  license_file: LICENSE.rst

extra:
  recipe-maintainers:
    - astrofrog
    - drdavella
    - mwcraig
